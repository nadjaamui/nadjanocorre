}

}
#agenda-app .lane.active { border-color: var(--accent-500); }
#agenda-app .lane-fill {

}
#agenda-app .lane.has-milestone .lane-fill { background: var(--copper); }
#agenda-app .lane-num {

}
#agenda-app .lane-fill ~ .lane-num { color: #fdf3de; }

#agenda-app .stat-label {

    {d:'2026-09-25',dow:'sex',w:6,dayType:'descanso',title:'Descanso',simple:true},
    {d:'2026-09-26',dow:'sab',w:6,dayType:'teste',title:'Teste Principal',activities:[
      {key:'corrida',icon:'🏁',label:'Corrida 5 km sem caminhar',accentKey:'copper'},
    ]},
    {d:'2026-09-27',dow:'dom',w:6,dayType:'descanso',title:'Descanso',simple:true},

    {d:'2026-09-28',dow:'seg',w:7,dayType:'muaythai',title:'Muay Thai + Academia',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'academia',icon:'🏋️',label:'Academia',details:['Membros superiores + core'],accentKey:'accent-500'},
    ]},
    {d:'2026-09-29',dow:'ter',w:7,dayType:'corrida',title:'Corrida',activities:[
      {key:'corrida',icon:'🏃',label:'Corrida',time:'40 min',details:['4 km contínuos a 7 km/h'],accentKey:'accent-500'},
    ]},
    {d:'2026-09-30',dow:'qua',w:7,dayType:'muaythai',title:'Muay Thai + Academia',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'academia',icon:'🏋️',label:'Academia',details:['Membros inferiores'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-01',dow:'qui',w:7,dayType:'corrida',title:'Corrida',activities:[
      {key:'corrida',icon:'🏃',label:'Corrida',time:'45 min',details:['5 km contínuos a 7 km/h'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-02',dow:'sex',w:7,dayType:'muaythai',title:'Muay Thai + Academia',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'academia',icon:'🏋️',label:'Academia',details:['Membros superiores + core'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-03',dow:'sab',w:7,dayType:'corrida',title:'Corrida',activities:[
      {key:'corrida',icon:'🏃',label:'Corrida',time:'55–60 min',details:['6 km contínuos a 7 km/h'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-04',dow:'dom',w:7,dayType:'descanso',title:'Descanso',simple:true},

    {d:'2026-10-05',dow:'seg',w:8,dayType:'muaythai',title:'Muay Thai + Academia',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'academia',icon:'🏋️',label:'Academia',details:['Membros inferiores'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-06',dow:'ter',w:8,dayType:'corrida',title:'Corrida',activities:[
      {key:'corrida',icon:'🏃',label:'Corrida',time:'40 min',details:['4 km contínuos a 7 km/h'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-07',dow:'qua',w:8,dayType:'muaythai',title:'Muay Thai + Academia',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'academia',icon:'🏋️',label:'Academia',details:['Membros superiores + core'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-08',dow:'qui',w:8,dayType:'corrida',title:'Corrida',activities:[
      {key:'corrida',icon:'🏃',label:'Corrida',time:'45 min',details:['5 km contínuos a 7 km/h'],accentKey:'accent-500'},
    ]},
    {d:'2026-10-09',dow:'sex',w:8,dayType:'muaythai',title:'Muay Thai + Alongamento',activities:[
      {key:'muaythai',icon:'🥊',label:'Muay Thai',time:'7h',accentKey:'accent-700'},
      {key:'alongamento',icon:'🧘',label:'Alongamento',accentKey:'accent-300'},
    ]},
    {d:'2026-10-10',dow:'sab',w:8,dayType:'objetivo',title:'Objetivo Final',activities:[
      {key:'corrida',icon:'🎯',label:'Corrida 5 km sem caminhar',accentKey:'copper'},
    ]},
    {d:'2026-10-11',dow:'dom',w:8,dayType:'descanso',title:'Descanso',simple:true},
  ];

  const DAYTYPE_BORDER = {
    muaythai:  'var(--accent-700)',
    corrida:   'var(--accent-500)',
    combo:     'var(--accent-600)',
    descanso:  'var(--descanso)',
    viagem:    'var(--accent-300)',
    teste:     'var(--copper)',
    objetivo:  'var(--copper)',
  };
  const SIMPLE_ICON = { descanso: '😴', viagem: '✈️' };
  const STATUS_META = {
    green:  {emoji:'🟢', color:'#2f9e56'},
    yellow: {emoji:'🟡', color:'#d9a428'},
    red:    {emoji:'🔴', color:'#d64545'},
    star:   {emoji:'⭐', color:'#bb6a2c'},
  };
  const STATUS_ORDER = ['green','yellow','red','star'];

  const WEEKS = [];
  for (let w = 1; w <= 8; w++) {
    const days = DAYS.filter(d => d.w === w);
    WEEKS.push({ w, days, start: days[0].d, end: days[days.length - 1].d });
  }

  function fmtRange(start, end) {
    const s = start.slice(8,10) + '/' + start.slice(5,7);
    const e = end.slice(8,10) + '/' + end.slice(5,7);
    return s + ' – ' + e;
  }
  function fmtDD(dateStr) { return dateStr.slice(8,10); }

  const todayObj = new Date();
  todayObj.setHours(0,0,0,0);
  function toDateOnly(str){ const p = str.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  const todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth()+1).padStart(2,'0') + '-' + String(todayObj.getDate()).padStart(2,'0');

  const OBJETIVO_DATE = toDateOnly('2026-10-10');
  const TESTE_DATE = toDateOnly('2026-09-26');

  let statuses = {}; // key: `${date}::${activityKey}` -> status
  let activeWeek = 1;
  for (const wk of WEEKS) { if (todayStr >= wk.start && todayStr <= wk.end) activeWeek = wk.w; }
  if (todayStr < WEEKS[0].start) activeWeek = 1;
  if (todayStr > WEEKS[WEEKS.length-1].end) activeWeek = 8;

  const $ = sel => document.querySelector(sel);
  function statusKey(date, actKey) { return date + '::' + actKey; }

  function renderHero() {
    const diff = Math.round((OBJETIVO_DATE - todayObj) / 86400000);
    let num, label;
    if (diff > 0) { num = diff; label = 'dias até correr 5 km sem caminhar 🎯'; }
    else if (diff === 0) { num = 'HOJE'; label = 'é o dia do objetivo final 🎯'; }
    else { num = '—'; label = 'período do plano encerrado'; }
    $('#hero-number').textContent = num;
    $('#hero-label').textContent = label;

    const diffTeste = Math.round((TESTE_DATE - todayObj) / 86400000);
    let subTxt = '';
    if (diffTeste > 0) subTxt = 'Teste principal (🏁 5 km) em <b>' + diffTeste + ' dias</b>, dia 26/09.';
    else if (diffTeste === 0) subTxt = '<b>Hoje é o teste principal</b> — 5 km sem caminhar 🏁';
    else subTxt = 'Teste principal já realizado — objetivo final em 10/10.';
    $('#hero-sub').innerHTML = subTxt;
  }

  function dayActivityCount(day) { return day.simple ? 0 : day.activities.length; }
  function dayLoggedCount(day) {
    if (day.simple) return 0;
    return day.activities.filter(a => statuses[statusKey(day.d, a.key)]).length;
  }

  function weekStats(wk) {
    const total = wk.days.reduce((s,d) => s + dayActivityCount(d), 0);
    const logged = wk.days.reduce((s,d) => s + dayLoggedCount(d), 0);
    return {total, logged};
  }

  function renderTrack() {
    const track = $('#track');
    track.innerHTML = '';
    WEEKS.forEach(wk => {
      const {total, logged} = weekStats(wk);
      const pct = total ? Math.round((logged/total)*100) : 0;
      const hasMilestone = wk.days.some(d => d.dayType === 'teste' || d.dayType === 'objetivo');
      const lane = document.createElement('div');
      lane.className = 'lane' + (wk.w === activeWeek ? ' active' : '') + (hasMilestone ? ' has-milestone' : '');
      lane.innerHTML = '<div class="lane-fill" style="width:' + pct + '%"></div><div class="lane-num">' + wk.w + '</div>';
      lane.addEventListener('click', () => { activeWeek = wk.w; renderAll(); scrollTabIntoView(); });
      track.appendChild(lane);
    });
  }

  function renderChips() {
    const chips = $('#chips');
    if (chips.childElementCount) return;
    const data = [
      ['🚶','Caminhada','5,5 km/h'],
      ['🏃','Corrida leve','6,5 km/h'],
      ['🏃','Corrida moderada','6,8 km/h'],
      ['🏃','Corrida contínua','7,0 km/h'],
    ];
    chips.innerHTML = data.map(([icon,label,val]) =>
      '<div class="chip">' + icon + ' ' + label + ' · <b>' + val + '</b></div>'
    ).join('');
  }

  function renderStats() {
    const counts = {green:0, yellow:0, red:0, star:0};
    DAYS.forEach(day => {
      if (day.simple) return;
      day.activities.forEach(a => {
        const s = statuses[statusKey(day.d, a.key)];
        if (s && counts[s] !== undefined) counts[s]++;
      });
    });
    const stats = $('#stats');
    stats.innerHTML = [
      ['🟢','concluídos', counts.green],
      ['🟡','caminhei', counts.yellow],
      ['🔴','não rolou', counts.red],
      ['⭐','recordes', counts.star],
    ].map(([e,l,n]) =>
      '<div class="stat"><div class="stat-emoji">'+e+'</div><div class="stat-num disp">'+n+'</div><div class="stat-label">'+l+'</div></div>'
    ).join('');
  }

  function scrollTabIntoView() {
    const el = document.querySelector('.tab[data-week="'+activeWeek+'"]');
    if (el) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function renderTabs() {
    const tabs = $('#tabs');
    tabs.innerHTML = WEEKS.map(wk =>
      '<div class="tab' + (wk.w===activeWeek ? ' active':'') + '" data-week="'+wk.w+'">S'+wk.w+
      '<span class="tab-range">'+fmtRange(wk.start, wk.end)+'</span></div>'
    ).join('');
    tabs.querySelectorAll('.tab').forEach(el => {
      el.addEventListener('click', () => {
        activeWeek = parseInt(el.getAttribute('data-week'));
        renderAll();
      });
    });
  }

  function statusButtonsHtml(dateStr, actKey) {
    const key = statusKey(dateStr, actKey);
    return '<div class="status-row">' + STATUS_ORDER.map(sk => {
      const meta = STATUS_META[sk];
      const on = statuses[key] === sk;
      return '<div class="status-btn'+(on?' on':'')+'" style="--sb-color:'+meta.color+'" data-key="'+key+'" data-status="'+sk+'">'+meta.emoji+'</div>';
    }).join('') + '</div>';
  }

  function renderCard(day) {
    const borderColor = DAYTYPE_BORDER[day.dayType] || 'var(--border)';
    const isToday = day.d === todayStr;

    if (day.simple) {
      const icon = SIMPLE_ICON[day.dayType] || '·';
      return '<div class="card simple" style="--type-color:'+borderColor+'">' +
        '<div class="card-date"><div class="dd disp">'+fmtDD(day.d)+'</div><div class="dow">'+day.dow+'</div></div>' +
        '<div class="simple-label">'+icon+' '+day.title+(isToday?' <span class="today-badge">HOJE</span>':'')+'</div>' +
      '</div>';
    }

    const activitiesHtml = day.activities.map(a => {
      const details = (a.details||[]).map(li => '<li>'+li+'</li>').join('');
      const actColor = 'var(--' + a.accentKey + ')';
      return '<div class="activity-block">' +
        '<div class="activity-head">' +
          '<span class="activity-icon" style="--act-color:'+actColor+'">'+a.icon+'</span>' +
          '<span class="activity-label">'+a.label+'</span>' +
          (a.time ? '<span class="activity-time">· '+a.time+'</span>' : '') +
        '</div>' +
        (details ? '<ul class="activity-details">'+details+'</ul>' : '') +
        statusButtonsHtml(day.d, a.key) +
      '</div>';
    }).join('');

    return '<div class="card'+(isToday?' today':'')+'" style="--type-color:'+borderColor+'">' +
      '<div class="card-top">' +
        '<div class="card-date"><div class="dd disp">'+fmtDD(day.d)+'</div><div class="dow">'+day.dow+'</div></div>' +
        '<div class="card-body">' +
          '<div class="card-title-row"><span class="card-title">'+day.title+'</span>' + (isToday?'<span class="today-badge">HOJE</span>':'') + '</div>' +
          '<div class="activities">'+activitiesHtml+'</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderWeek() {
    const wk = WEEKS.find(w => w.w === activeWeek);
    $('#week-title').textContent = 'Semana ' + wk.w;
    $('#week-range').textContent = fmtRange(wk.start, wk.end);
    const {total, logged} = weekStats(wk);
    $('#week-pill').textContent = logged + '/' + total;
    $('#cards').innerHTML = wk.days.map(renderCard).join('');

    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const key = btn.getAttribute('data-key');
        const status = btn.getAttribute('data-status');
        if (statuses[key] === status) delete statuses[key];
        else statuses[key] = status;
        renderAll();
        await saveStatuses();
      });
    });
  }

  function renderAll() {
    renderHero();
    renderTrack();
    renderChips();
    renderStats();
    renderTabs();
    renderWeek();
  }

  async function loadStatuses() {
    try {
      const res = await window.storage.get('statuses', false);
      statuses = res && res.value ? JSON.parse(res.value) : {};
    } catch (e) {
      statuses = {};
    }
    renderAll();
    requestAnimationFrame(scrollTabIntoView);
  }

  async function saveStatuses() {
    try {
      await window.storage.set('statuses', JSON.stringify(statuses), false);
    } catch (e) {
      console.error('Erro ao salvar progresso:', e);
    }
  }

  $('#reset-link').addEventListener('click', async () => {
    if (!confirm('Apagar todo o progresso registrado nesta agenda? Essa ação não pode ser desfeita.')) return;
    statuses = {};
    renderAll();
    await saveStatuses();
  });

  loadStatuses();
})();
</script>
